name: Daily AI tracker ingestion

# The nightly cron is deliberately switched off: the API-key route bills per
# call, and this tracker is updated by a scheduled Claude Code session instead.
# Re-enable the schedule block below if you ever add ANTHROPIC_API_KEY.
on:
  # schedule:
  #   - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Lower bound date (YYYY-MM-DD). Leave empty for the last 3 days."
        required: false
      tracker:
        description: "Only one tracker: business or marketing. Leave empty for both."
        required: false

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.since }}" ]; then ARGS="$ARGS --since ${{ inputs.since }}"; fi
          if [ -n "${{ inputs.tracker }}" ]; then ARGS="$ARGS --tracker ${{ inputs.tracker }}"; fi
          python scripts/ingest.py $ARGS

      - name: Commit updated data
        run: |
          git config user.name "ai-business-tracker-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- data/; then
            git add data/
            git commit -m "data: daily ingestion $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new data today."
          fi
